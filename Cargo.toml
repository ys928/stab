[package]
name = "stab"
version = "0.3.1"
authors = ["ys928 <it_yushi@163.com>"]
edition = "2021"
description = "a simple CLI tool for making tunnels to localhost"
keywords = ["network", "cli", "tunnel", "tcp"]
categories = [
    "network-programming",
    "web-programming",
    "command-line-utilities",
]
license = "MIT"
readme = "readme.md"
repository = "https://github.com/ys928/stab"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.11", features = ["serde", "v4"] }
clap = { version = "4.5", features = ["derive"] }
anstyle = "1.0"
sha2 = "0.10"
axum = "0.8"
chrono = "0.4"
toml = "0.8"
tracing-subscriber = { version = "0.3.19", features = ["chrono", "time"] }
anyhow = "1.0"
tracing-appender = "0.2"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"
