name: CI

on:
  push:
    # Listing branches (and omitting tags) runs CI on branch pushes only.
    # A lone tags-ignore would skip all branch pushes — GitHub treats the
    # unspecified ref type as excluded. Release already covers version tags.
    branches:
      - "**"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 / arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS amd64 / arm64
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows amd64 / arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # Android arm64 (Termux / Android Linux)
          - target: aarch64-linux-android
            os: ubuntu-latest
            android: true
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Android NDK
        if: matrix.android
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Configure Android linker
        if: matrix.android
        run: |
          set -eux
          ndk='${{ steps.setup-ndk.outputs.ndk-path }}'
          toolchain="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${ndk}" >> "${GITHUB_ENV}"
          echo "${toolchain}" >> "${GITHUB_PATH}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${toolchain}/aarch64-linux-android24-clang" >> "${GITHUB_ENV}"
          echo "CC_aarch64_linux_android=${toolchain}/aarch64-linux-android24-clang" >> "${GITHUB_ENV}"
          echo "AR_aarch64_linux_android=${toolchain}/llvm-ar" >> "${GITHUB_ENV}"

      # Same build path as release, but dry-run only (no upload / no GitHub Release).
      # asset keeps assets[] non-empty: macOS bash 3.2 + set -u fails on
      # assets[@] when tar/zip are both none (upstream upload-rust-binary-action).
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stab
          target: ${{ matrix.target }}
          tar: none
          zip: none
          asset: LICENSE
          dry-run: true
          dry-run-intended: true
          build-tool: ${{ matrix.build-tool }}
