name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Only allow tags whose commit is reachable from main.
          branch: main
          # Version notes are taken from the matching section in this file.
          changelog: doc/Changelog.txt
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 / arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS amd64 / arm64
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows amd64 / arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Build only (no archive); upload the bare binary so downloads run without unzipping.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stab
          target: ${{ matrix.target }}
          tar: none
          zip: none
          dry-run: true
          dry-run-intended: true
      - name: Upload binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          target='${{ matrix.target }}'
          exe_suffix=''
          case "${target}" in
            *-windows-*) exe_suffix='.exe' ;;
          esac
          src="target/${target}/release/stab${exe_suffix}"
          asset="stab-${target}${exe_suffix}"
          cp -- "${src}" "${asset}"
          chmod +x "${asset}"
          gh release upload "${{ github.ref_name }}" "${asset}" --clobber

  update-release-branch:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Point release branch at this tag
        run: |
          set -eux
          git fetch origin "${{ github.ref }}" --tags
          git push origin "refs/tags/${{ github.ref_name }}:refs/heads/release" --force
