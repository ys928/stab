name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Only allow tags whose commit is reachable from main.
          branch: main
          # Version notes are taken from the matching section in this file.
          changelog: doc/Changelog.txt
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 / arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS amd64 / arm64
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows amd64 / arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # Android arm64 (Termux / Android Linux)
          - target: aarch64-linux-android
            os: ubuntu-latest
            android: true
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Android NDK
        if: matrix.android
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Configure Android linker
        if: matrix.android
        run: |
          set -eux
          ndk='${{ steps.setup-ndk.outputs.ndk-path }}'
          toolchain="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${ndk}" >> "${GITHUB_ENV}"
          echo "${toolchain}" >> "${GITHUB_PATH}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${toolchain}/aarch64-linux-android24-clang" >> "${GITHUB_ENV}"
          echo "CC_aarch64_linux_android=${toolchain}/aarch64-linux-android24-clang" >> "${GITHUB_ENV}"
          echo "AR_aarch64_linux_android=${toolchain}/llvm-ar" >> "${GITHUB_ENV}"

      # Build only (no archive); upload the bare binary so downloads run without unzipping.
      # asset keeps assets[] non-empty: macOS bash 3.2 + set -u fails on
      # assets[@] when tar/zip are both none (upstream upload-rust-binary-action).
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stab
          target: ${{ matrix.target }}
          tar: none
          zip: none
          asset: LICENSE
          dry-run: true
          dry-run-intended: true
          build-tool: ${{ matrix.build-tool }}
      - name: Upload binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          target='${{ matrix.target }}'
          exe_suffix=''
          case "${target}" in
            *-windows-*) exe_suffix='.exe' ;;
          esac
          src="target/${target}/release/stab${exe_suffix}"
          asset="stab-${target}${exe_suffix}"
          cp -- "${src}" "${asset}"
          chmod +x "${asset}"
          gh release upload "${{ github.ref_name }}" "${asset}" --clobber

  update-release-branch:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Point release branch at this tag
        run: |
          set -eux
          git fetch origin "${{ github.ref }}" --tags
          git push origin "refs/tags/${{ github.ref_name }}:refs/heads/release" --force
